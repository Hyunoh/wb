<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="운동보드">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
  <title>workoutBoard · 디자인 목업</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="title-row">
        <button class="icon-btn" id="prev" aria-label="이전 달">‹</button>
        <div class="title">
          <h1 id="month-title">2026년 11월</h1>
          <p class="synced" id="synced">3분 전 업데이트</p>
        </div>
        <button class="icon-btn" id="next" aria-label="다음 달">›</button>
        <button class="today-btn" id="today">오늘</button>
      </div>
      <div class="segmented" role="tablist" id="filter">
        <button data-f="both" class="on">둘 다</button>
        <button data-f="me"><i class="sw me"></i>나</button>
        <button data-f="wife"><i class="sw wife"></i>아내</button>
      </div>
    </header>

    <section class="summary" id="summary"></section>

    <main class="cal">
      <div class="weekdays">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="grid" id="grid"></div>
    </main>

  </div>

  <!-- 날짜 상세 바텀시트 -->
  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="grabber"></div>
    <div class="sheet-head">
      <button class="icon-btn" id="day-prev" aria-label="전날">‹</button>
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" id="day-next" aria-label="다음날">›</button>
      <button class="close" id="close" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <!-- 키 입력 화면 -->
  <section class="gate" id="gate" hidden>
    <div class="gate-card">
      <div class="logo">🏃‍♂️🧘‍♀️</div>
      <h1>운동보드</h1>
      <p>공유 키를 입력하면 이 기기에서는<br>다음부터 바로 열려요.</p>
      <form id="gate-form">
        <input id="gate-key" type="password" inputmode="text" autocomplete="current-password" placeholder="공유 키" aria-label="공유 키">
        <p class="gate-err" id="gate-err" hidden>키가 맞지 않아요. 다시 확인해 주세요.</p>
        <button type="submit">열기</button>
      </form>
    </div>
  </section>

  <!-- 목업 전용: ?demo=1 일 때만 보이는 다크 모드 전환 -->
  <div class="demo" id="demo" hidden>
    <button id="demo-theme">🌓</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
